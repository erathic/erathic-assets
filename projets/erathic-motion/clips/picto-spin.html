<script>
const DUR = 6, S = 0.58;
const LCX = 1000, LCY = 1000;          // centre du logo (unités du SVG source)
const ECX = 1008, ECY = 1179;          // centre de l'oeil
const el = id => document.getElementById(id);
const ease = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;
const clamp = (x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg = (t,a,b)=>clamp((t-a)/(b-a));
function openness(t){
  let o = ease(seg(t,0.25,0.9));
  const blink = ease(seg(t,3.0,3.18)) - ease(seg(t,3.18,3.4));
  o *= (1 - clamp(blink)*0.95);
  o *= (1 - ease(seg(t,5.3,5.85)));
  return clamp(o);
}
function render(t){
  t = ((t % DUR) + DUR) % DUR;
  const th = ease(seg(t,1.3,4.7)) * Math.PI*2;
  const sx = Math.cos(th);
  const bob = Math.sin(t/DUR*Math.PI*2)*8;
  const sc = S*(1 + 0.02*Math.sin(t/DUR*Math.PI*2));
  el('icon').setAttribute('transform',
    `translate(960 ${540+bob}) scale(${sc*sx} ${sc}) translate(${-LCX} ${-LCY})`);
  const o = Math.max(openness(t), 0.0001);
  el('eyeFill').setAttribute('transform',
    `translate(${ECX} ${ECY}) scale(1 ${o}) translate(${-ECX} ${-ECY})`);
}
window.render = render; window.DUR = DUR; render(0);
</script></body></html>
